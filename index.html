<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pro - Alerta de Duplicados</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

    <style>
        :root { --primary: #4a90e2; --success: #28a745; --warning: #f39c12; --danger: #dc3545; --dark: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        #scanner-container { 
            width: 100%; height: 250px; background: #000; border-radius: 10px; 
            overflow: hidden; position: relative; margin-bottom: 20px; border: 4px solid #ddd;
        }
        #scanner-container video { width: 100%; height: 100%; object-fit: cover; }
        
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        
        button { padding: 15px; background-color: var(--success); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #ccc; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
        .status-msg { font-size: 13px; text-align: center; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Escáner de Galería</h1>
    <div id="status" class="status-msg">Iniciando cámara...</div>
    
    <div id="scanner-container"></div>
    
    <div class="input-group">
        <input type="text" id="barcode-res" placeholder="Código de barras..." readonly>
        <input type="text" id="product-name" placeholder="Nombre del producto">
        <button id="btn-save" onclick="guardarProducto()">GUARDAR EN GALERÍA</button>
    </div>

    <div class="gallery-section">
        <h3>Productos Guardados</h3>
        <table>
            <thead>
                <tr><th>Código</th><th>Nombre</th></tr>
            </thead>
            <tbody id="gallery-body"></tbody>
        </table>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('galeria_codigos')) || [];
    let isPaused = false; // Para evitar múltiples alertas seguidas

    function iniciarEscanner() {
        Quagga.init({
            inputStream: {
                name: "Live", type: "LiveStream",
                target: document.querySelector('#scanner-container'),
                constraints: { facingMode: "environment" }
            },
            decoder: { readers: ["ean_reader", "code_128_reader", "upc_reader"] }
        }, function(err) {
            if (err) { document.getElementById('status').innerText = "Error: " + err.name; return; }
            Quagga.start();
            document.getElementById('status').innerText = "Cámara activa.";
        });
    }

    Quagga.onDetected(function(result) {
        if (isPaused) return; // Si hay una alerta activa, no procesar más

        const code = result.codeResult.code;
        const inputCodigo = document.getElementById('barcode-res');
        const inputNombre = document.getElementById('product-name');
        
        // Buscar duplicado
        const productoExistente = db.find(p => p.codigo === code);

        if (productoExistente) {
            isPaused = true; // Pausar escaneo
            inputCodigo.value = code;
            inputNombre.value = productoExistente.nombre;
            
            // Sonido o vibración
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            // LANZAR ALERTA
            alert(`⚠️ PRODUCTO EXISTENTE\n\nNombre: ${productoExistente.nombre}\nCódigo: ${code}`);
            
            // Reiniciar campos tras la alerta para permitir nuevo escaneo
            setTimeout(() => { isPaused = false; }, 1000); 
        } else {
            // Es un código nuevo
            inputCodigo.value = code;
            inputNombre.value = "";
            inputNombre.focus();
        }
    });

    function guardarProducto() {
        const codigo = document.getElementById('barcode-res').value;
        const nombre = document.getElementById('product-name').value.trim();

        if (!codigo || !nombre) {
            alert("Completa todos los datos.");
            return;
        }

        // Validación extra por si el usuario intenta guardar un nombre que ya existe
        if (db.some(p => p.nombre.toLowerCase() === nombre.toLowerCase())) {
            alert("Este nombre ya está en uso.");
            return;
        }

        db.push({ codigo, nombre });
        localStorage.setItem('galeria_codigos', JSON.stringify(db));
        
        renderTable();
        document.getElementById('barcode-res').value = "";
        document.getElementById('product-name').value = "";
        alert("¡Guardado con éxito!");
    }

    function renderTable() {
        const body = document.getElementById('gallery-body');
        body.innerHTML = db.slice().reverse().map(p => `
            <tr>
                <td>${p.codigo}</td>
                <td>${p.nombre}</td>
            </tr>
        `).join('');
    }

    window.onload = () => {
        iniciarEscanner();
        renderTable();
    };
</script>

</body>
</html>
