<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pro - Con Permisos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

    <style>
        :root { --primary: #4a90e2; --success: #28a745; --danger: #dc3545; --dark: #333; }
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--dark); }
        
        #scanner-container { 
            width: 100%; height: 250px; background: #000; border-radius: 10px; 
            overflow: hidden; position: relative; margin-bottom: 20px; border: 3px solid #ddd;
        }
        #scanner-container video { width: 100%; height: 100%; object-fit: cover; }
        
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { padding: 15px; background-color: var(--success); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-retry { background-color: var(--primary); margin-top: 10px; display: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        .status-msg { font-size: 12px; text-align: center; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Escáner de Inventario</h1>
    <div id="status" class="status-msg">Solicitando acceso a la cámara...</div>
    
    <div id="scanner-container"></div>
    
    <button id="btn-retry" class="btn-retry" onclick="iniciarEscanner()">Reintentar Cámara / Pedir Permiso</button>

    <div class="input-group">
        <input type="text" id="barcode-res" placeholder="Código detectado..." readonly>
        <input type="text" id="product-name" placeholder="Nombre del producto">
        <button onclick="guardarProducto()">AGREGAR A GALERÍA</button>
    </div>

    <div class="gallery-section">
        <h3>Productos Guardados</h3>
        <table>
            <thead>
                <tr><th>Código</th><th>Nombre</th></tr>
            </thead>
            <tbody id="gallery-body"></tbody>
        </table>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('galeria_codigos')) || [];

    // Función para iniciar el escáner y solicitar permisos
    function iniciarEscanner() {
        const status = document.getElementById('status');
        const retryBtn = document.getElementById('btn-retry');

        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#scanner-container'),
                constraints: {
                    facingMode: "environment", // Cámara trasera
                    width: { min: 640 },
                    height: { min: 480 }
                },
            },
            decoder: { readers: ["ean_reader", "code_128_reader"] }
        }, function(err) {
            if (err) {
                console.error(err);
                if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
                    status.innerHTML = "<b style='color:red;'>Permiso denegado.</b> Por favor, activa la cámara en la configuración de tu navegador.";
                } else {
                    status.innerHTML = "Error al iniciar cámara: " + err.name;
                }
                retryBtn.style.display = "block";
                return;
            }
            status.innerHTML = "Cámara activa. Apunta a un código de barras.";
            retryBtn.style.display = "none";
            Quagga.start();
        });
    }

    // Escucha la detección de códigos
    Quagga.onDetected(function(result) {
        const code = result.codeResult.code;
        document.getElementById('barcode-res').value = code;
        // Sonido breve o vibración (opcional)
        if (navigator.vibrate) navigator.vibrate(100);
    });

    function guardarProducto() {
        const codigo = document.getElementById('barcode-res').value;
        const nombre = document.getElementById('product-name').value.trim();

        if (!codigo || !nombre) {
            alert("Escanea un código y escribe un nombre.");
            return;
        }

        // Validación de Duplicados (Mismo código o mismo nombre)
        if (db.some(p => p.codigo === codigo)) return alert("El CÓDIGO ya existe.");
        if (db.some(p => p.nombre.toLowerCase() === nombre.toLowerCase())) return alert("El NOMBRE ya existe.");

        db.push({ codigo, nombre });
        localStorage.setItem('galeria_codigos', JSON.stringify(db));
        renderTable();
        
        document.getElementById('product-name').value = "";
        document.getElementById('barcode-res').value = "";
    }

    function renderTable() {
        const body = document.getElementById('gallery-body');
        body.innerHTML = db.map(p => `<tr><td>${p.codigo}</td><td>${p.nombre}</td></tr>`).join('');
    }

    // Ejecutar al cargar la página
    window.onload = () => {
        iniciarEscanner();
        renderTable();
    };
</script>

</body>
</html>
