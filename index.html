<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Pro - Escáner & Gestión</title>
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <style>
        :root { --primario: #3498db; --secundario: #2c3e50; --exito: #27ae60; --fondo: #f0f3f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--fondo); margin: 0; padding: 0; }
        
        /* Navegación */
        nav { background: var(--secundario); display: flex; position: sticky; top: 0; z-index: 1000; }
        nav button { flex: 1; background: none; border: none; color: white; padding: 15px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        nav button.active { background: var(--primario); }

        .container { max-width: 800px; margin: auto; padding: 15px; }
        .seccion { display: none; }
        .seccion.active { display: block; }

        /* Cámara Visor */
        .cam-box { background: #000; border-radius: 12px; overflow: hidden; height: 200px; position: relative; margin-bottom: 15px; border: 3px solid var(--primario); }
        #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
        
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        .btn { border: none; padding: 15px; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; width: 100%; }
        .btn-blue { background: var(--primario); }
        .btn-green { background: var(--exito); margin-top: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .total { font-size: 2rem; font-weight: bold; text-align: right; margin: 15px 0; color: var(--secundario); }
    </style>
</head>
<body>

<nav>
    <button id="btnV" class="active" onclick="cambiarSeccion('ventas')">🛒 VENTAS</button>
    <button id="btnI" onclick="cambiarSeccion('inventario')">📦 INVENTARIO</button>
</nav>

<div class="container">
    
    <div class="cam-box" id="areaCamara">
        <div id="interactive" class="viewport"></div>
    </div>
    <button class="btn btn-blue" onclick="toggleCamara()" id="btnCamControl">📷 Encender Escáner</button>
    <p id="codigoDetectado" style="text-align: center; font-weight: bold; color: var(--primario); margin: 10px 0;">Esperando código...</p>

    <hr>

    <div id="sec-ventas" class="seccion active">
        <div class="card">
            <h3>Nueva Venta</h3>
            <input type="text" id="v_codigo" placeholder="Código escaneado" readonly>
            <input type="number" id="v_cantidad" value="1" min="1" placeholder="Cantidad">
            <button class="btn btn-blue" onclick="agregarVenta()">+ Añadir a la Venta</button>
        </div>
        
        <div class="card">
            <h3>Ticket</h3>
            <div id="listaCarrito"></div>
            <div class="total">$<span id="totalVenta">0.00</span></div>
            <button class="btn btn-green" onclick="finalizarCobro()">CONFIRMAR COBRO</button>
        </div>
    </div>

    <div id="sec-inventario" class="seccion">
        <div class="card">
            <h3>Registrar / Editar Producto</h3>
            <input type="text" id="i_codigo" placeholder="Código de barras">
            <input type="text" id="i_nombre" placeholder="Nombre del Producto">
            <input type="number" id="i_precio" placeholder="Precio de Venta">
            <input type="number" id="i_stock" placeholder="Cantidad en Stock">
            <button class="btn btn-blue" onclick="guardarProducto()">Guardar en Sistema</button>
        </div>

        <div class="card">
            <h3>Lista de Existencias</h3>
            <table id="tablaStock">
                <thead><tr><th>Cod</th><th>Producto</th><th>Stock</th><th>Precio</th></tr></thead>
                <tbody id="bodyStock"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    let inventario = JSON.parse(localStorage.getItem('pos_full_inv')) || [];
    let carrito = [];
    let seccionActual = 'ventas';
    let camaraEncendida = false;

    // --- CONTROL DE NAVEGACIÓN ---
    function cambiarSeccion(id) {
        seccionActual = id;
        document.querySelectorAll('.seccion').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-' + id).classList.add('active');
        document.getElementById('btn' + (id === 'ventas' ? 'V' : 'I')).classList.add('active');
        actualizarTablas();
    }

    // --- LÓGICA DE ESCÁNER ---
    function toggleCamara() {
        if (!camaraEncendida) {
            Quagga.init({
                inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#interactive'), constraints: { facingMode: "environment" } },
                decoder: { readers: ["ean_reader", "code_128_reader", "upc_reader"] }
            }, (err) => { if (err) return; Quagga.start(); });
            document.getElementById('btnCamControl').innerText = "🛑 Apagar Escáner";
        } else {
            Quagga.stop();
            document.getElementById('btnCamControl').innerText = "📷 Encender Escáner";
        }
        camaraEncendida = !camaraEncendida;
    }

    Quagga.onDetected((data) => {
        const codigo = data.codeResult.code;
        document.getElementById('codigoDetectado').innerText = "Leído: " + codigo;
        new Audio('https://www.soundjay.com/buttons/beep-07.wav').play();

        if (seccionActual === 'ventas') {
            document.getElementById('v_codigo').value = codigo;
        } else {
            document.getElementById('i_codigo').value = codigo;
            // Si el producto ya existe, cargar sus datos automáticamente
            const p = inventario.find(item => item.codigo === codigo);
            if (p) {
                document.getElementById('i_nombre').value = p.nombre;
                document.getElementById('i_precio').value = p.precio;
                document.getElementById('i_stock').value = p.stock;
            }
        }
    });

    // --- FUNCIONES DE INVENTARIO ---
    function guardarProducto() {
        const codigo = document.getElementById('i_codigo').value;
        const nombre = document.getElementById('i_nombre').value;
        const precio = parseFloat(document.getElementById('i_precio').value);
        const stock = parseInt(document.getElementById('i_stock').value);

        if (codigo && nombre && !isNaN(precio)) {
            const index = inventario.findIndex(p => p.codigo === codigo);
            if (index > -1) {
                inventario[index] = { codigo, nombre, precio, stock };
            } else {
                inventario.push({ codigo, nombre, precio, stock });
            }
            localStorage.setItem('pos_full_inv', JSON.stringify(inventario));
            actualizarTablas();
            limpiarInputsInventario();
            alert("Inventario actualizado");
        }
    }

    // --- FUNCIONES DE VENTAS ---
    function agregarVenta() {
        const codigo = document.getElementById('v_codigo').value;
        const cantidad = parseInt(document.getElementById('v_cantidad').value);
        const producto = inventario.find(p => p.codigo === codigo);

        if (producto) {
            if (producto.stock >= cantidad) {
                producto.stock -= cantidad;
                carrito.push({ nombre: producto.nombre, cantidad, precio: producto.precio, subtotal: producto.precio * cantidad });
                actualizarTablas();
                document.getElementById('v_codigo').value = '';
                document.getElementById('v_cantidad').value = 1;
            } else {
                alert("Stock insuficiente. Disponible: " + producto.stock);
            }
        } else {
            alert("Producto no registrado en inventario.");
        }
    }

    function finalizarCobro() {
        if (carrito.length === 0) return;
        localStorage.setItem('pos_full_inv', JSON.stringify(inventario)); // Guardar rebaja de stock
        alert("Cobro exitoso por $" + document.getElementById('totalVenta').innerText);
        carrito = [];
        actualizarTablas();
    }

    // --- RENDER ---
    function actualizarTablas() {
        // Tabla Inventario
        const bodyS = document.getElementById('bodyStock');
        bodyS.innerHTML = '';
        inventario.forEach(p => {
            bodyS.innerHTML += `<tr><td>${p.codigo}</td><td>${p.nombre}</td><td>${p.stock}</td><td>$${p.precio}</td></tr>`;
        });

        // Ticket Ventas
        const listC = document.getElementById('listaCarrito');
        listC.innerHTML = '';
        let total = 0;
        carrito.forEach(item => {
            listC.innerHTML += `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom: 1px dashed #ccc;">
                <span>${item.cantidad}x ${item.nombre}</span><span>$${item.subtotal.toFixed(2)}</span></div>`;
            total += item.subtotal;
        });
        document.getElementById('totalVenta').innerText = total.toFixed(2);
    }

    function limpiarInputsInventario() {
        document.getElementById('i_codigo').value = '';
        document.getElementById('i_nombre').value = '';
        document.getElementById('i_precio').value = '';
        document.getElementById('i_stock').value = '';
    }

    actualizarTablas();
</script>

</body>
</html>
